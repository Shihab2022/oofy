services:
  postgres:
    image: postgres:15-alpine
    container_name: oofy-postgres
    environment:
      POSTGRES_DB: oofy
      POSTGRES_USER: oofy
      POSTGRES_PASSWORD: oofy_password
    ports:
      - "5432:5432"
    volumes:
      - oofy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oofy -d oofy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: oofy-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://oofy:oofy_password@postgres:5432/oofy?schema=public
    restart: unless-stopped

  frontend:
    container_name: oofy-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5000
      NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
    restart: unless-stopped

volumes:
  oofy-pgdata:
