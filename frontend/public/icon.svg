<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c18"/>
      <stop offset="100%" stop-color="#0b0d0b"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded luxury border -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="92" fill="none" stroke="#2e352e" stroke-width="12"/>

  <!-- Brand Typography -->
  <text x="256" y="295" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="160" letter-spacing="-8" text-anchor="middle">
    <tspan fill="#ffffff">OOF</tspan><tspan fill="#d2f83a">Y</tspan>
  </text>

  <!-- Tagline underneath -->
  <text x="256" y="375" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="28" letter-spacing="8" fill="#d2f83a" text-anchor="middle">
    DHAKA
  </text>

  <!-- Trademark Circle -->
  <circle cx="438" cy="180" r="16" fill="none" stroke="#d2f83a" stroke-width="4"/>
  <text x="438" y="186" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#d2f83a" text-anchor="middle">R</text>
</svg>
